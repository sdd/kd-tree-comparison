[package]
name = "kd-tree-comparison"
version = "0.1.0"
edition = "2021"
autobenches = false

[dependencies]
ahash = "0.7.8"
az = "1.2.1"
criterion = "0.4"
criterion-polyglot = "0.1"
fixed = "1.22"
fnntw = { version = "0.2", optional = true }
kiddo_v1 = { version = "0.2", package = "kiddo", optional = true }
kiddo_v2 = { version = "2.1.1", package = "kiddo", optional = true }
kiddo_v3 = { version = "3.0.0", package = "kiddo", features = ["immutable"], optional = true }
kiddo_v5 = { version = "5.0.0", package = "kiddo", features = ["simd"], optional = true }
kiddo_v6 = { path = "../kiddo", package = "kiddo", features = ["simd", "test_utils"], optional = true }
memmap = "0.7.0"
nabo = { version = "0.2", optional = true }
num-traits = "0.2.15"
ordered-float = "3.4.0"
rand = "0.8.5"
rkyv = { version = "0.7", default-features = false, features = ["alloc", "copy_unsafe", "size_64"] }
pretty_env_logger = "0.5.0"
log = "0.4.20"
indicatif = "0.17.7"

[features]
default = ["all-trees", "all-queries", "dims-3"]

# Tree/library selectors.
all-trees = [
    "tree-fnntw",
    "tree-kiddo-v1",
    "tree-kiddo-v2",
    "tree-kiddo-v3-immutable",
    "tree-kiddo-v3-std",
    "tree-kiddo-v5-immutable",
    "tree-kiddo-v6-flatvec-eytzinger",
    "tree-kiddo-v6-vecofarrays-eytzinger",
    "tree-kiddo-v6-vecofarenas-eytzinger",
    "tree-kiddo-v6-vecofarenas-eytzinger-pf",
    "tree-kiddo-v6-vecofarenas-eytzinger-pf-far",
    "tree-kiddo-v6-vecofarenas-donnelly",
    "tree-kiddo-v6-vecofarenas-donnelly-pf",
    "tree-kiddo-v6-vecofarenas-donnelly-block-simd",
    "tree-nabo",
    "tree-pykdtree",
    "tree-scipy",
    "tree-sklearn",
]

tree-fnntw = ["dep:fnntw", "dep:kiddo_v2"]
tree-kiddo-v1 = ["dep:kiddo_v1", "dep:kiddo_v2"]
tree-kiddo-v2 = ["dep:kiddo_v2"]
tree-kiddo-v3-immutable = ["dep:kiddo_v3"]
tree-kiddo-v3-std = ["dep:kiddo_v3"]
tree-kiddo-v5-immutable = ["dep:kiddo_v3", "dep:kiddo_v5"]
tree-kiddo-v6-flatvec-eytzinger = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarrays-eytzinger = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-eytzinger = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-eytzinger-pf = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-eytzinger-pf-far = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-donnelly = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-donnelly-pf = ["dep:kiddo_v6"]
tree-kiddo-v6-vecofarenas-donnelly-block-simd = ["dep:kiddo_v6"]
tree-nabo = ["dep:kiddo_v2", "dep:nabo"]
tree-pykdtree = ["dep:kiddo_v2"]
tree-scipy = ["dep:kiddo_v2"]
tree-sklearn = ["dep:kiddo_v2"]

# Query selectors.
all-queries = [
    "query-add-points",
    "query-best-n",
    "query-nearest-one",
    "query-nearest-n",
    "query-within",
    "query-within-unsorted",
    "query-nearest-n-within",
    "query-nearest-n-within-unsorted",
]
query-add-points = []
query-best-n = []
query-nearest-one = []
query-nearest-n = []
query-within = []
query-within-unsorted = []
query-nearest-n-within = []
query-nearest-n-within-unsorted = []

# Dimension selectors.
dims-any = []
dims-2 = ["dims-any"]
dims-3 = ["dims-any"]
dims-4 = ["dims-any"]
dims-all = ["dims-2", "dims-3", "dims-4"]

[lib]
name = "kd_tree_comparison"

[[bench]]
name = "add_points_fnntw"
harness = false
required-features = ["tree-fnntw", "query-add-points", "dims-any"]

