[package]
name = "kd-tree-comparison"
version = "0.1.0"
edition = "2021"
autobenches = false

[dependencies]

# kd-tree libraries under test
fnntw = "0.2"
kiddo_v1 = { version = "0.2", package = "kiddo" }
kiddo_v2 = { version = "2.1.1", package = "kiddo" }
kiddo_v3 = { version = "3", package = "kiddo", features = ["immutable"] }
kiddo_v5 = { version = "5", package = "kiddo" }
kiddo_v6 = { path = "../kiddo", package = "kiddo", features = ["fixed", "simd", "leaf_view_chunked"] }
nabo = "0.2"

# test dependencies
az = "1.2.1"
criterion = "0.4"
criterion-polyglot = "0.1"
fixed = "1.22"
memmap = "0.7.0"
num-traits = "0.2.15"
ordered-float = "3.4.0"
rand = "0.8.5"
rayon = "1.6.1"
rkyv = { version = "0.7", default-features = false, features = ["alloc", "copy_unsafe", "size_64"] }
pretty_env_logger = "0.5.0"
log = "0.4.20"
indicatif = "0.17.7"

[lib]
name = "kd_tree_comparison"

[features]
pykdtree = []
sklearn = []
scipy = []
fnntw = []
kiddo_v1 = []
kiddo_v2 = []
kiddo_v3_std = []
kiddo_v3_immutable = []
kiddo_v5_immutable = []
kiddo_v6 = []
nabo = []

add_points = []
best_n = []
nearest_n = []
nearest_one = []
nearest_n_within = []
nearest_n_within_unsorted = []
within = []
within_unsorted = []
deserialize = []
serialize = []

default = ["kiddo_v3_immutable", "kiddo_v3_std", "kiddo_v5_immutable", "nearest_one"]

[[bench]]
name = "add_points_fnntw"
harness = false
required-features = ["add_points", "fnntw"]

